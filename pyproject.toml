[project]
name = "action-gif-studio"
version = "0.1.0"
description = "Generate keyframe YAML for action gifs: place an avatar on an animated gif frame by frame and export the track a player composites."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "gnoul_" }]
keywords = ["gif", "animation", "avatar", "keyframes", "yaml", "tkinter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = [
    "pillow>=10.1.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
]

[project.scripts]
action-gif-studio = "action_studio.__main__:main"

[project.urls]
Repository = "https://github.com/gnoul4869/action-gif-studio"

[tool.setuptools]
packages = ["action_studio"]

[tool.ruff]
# Global options go here
line-length = 88

[tool.ruff.lint]
# Linting rules go here
extend-select = [
    "F",        # Pyflakes rules
    "W",        # PyCodeStyle warnings
    "E",        # PyCodeStyle errors
    "I",        # Sort imports properly
    "UP",       # Warn if certain things can changed due to newer Python versions
    "C4",       # Catch incorrect use of comprehensions, dict, list, etc
    "FA",       # Enforce from __future__ import annotations
    "ISC",      # Good use of string concatenation
    "ICN",      # Use common import conventions
    "RET",      # Good return practices
    "SIM",      # Common simplification rules
    "TID",      # Some good import practices
    "TC",       # Enforce importing certain types in a TYPE_CHECKING block
    "PTH",      # Use pathlib instead of os.path
    "TD",       # Be diligent with TODO comments
]

[tool.pytest.ini_options]
testpaths = ["tests"]
